<!-- table.html should include a class information input form with the following fields: class name, number of people, description, a class table that displays the entered class information, showing the above details for each entry. 
Implement functionality so that when data is entered and submitted via the form, the class  table updates dynamically without reloading the page. 
JavaScript Event Integration: Enhance interactivity by adding at least three JavaScript events. For example: Focus event: When an input field or table cell is focused. Click event: For interactions with table rows or buttons.
hover animation -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Information</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("class-form");
            const tableBody = document.getElementById("table-body");

            // Handle form submission
            form.addEventListener("submit", function (event) {
                event.preventDefault();

                // Get input values
                const className = document.getElementById("class-name").value;
                const numPeople = document.getElementById("num-people").value;
                const description = document.getElementById("description").value;

                // Create new table row
                const row = document.createElement("tr");
                row.tabIndex = 0; // Make row focusable

                row.innerHTML = `
                    <td>${className}</td>
                    <td>${numPeople}</td>
                    <td>${description}</td>
                    <td><button class="delete-btn">Delete</button></td>
                `;

                // Click event to highlight row
                row.addEventListener("click", function () {
                    row.classList.toggle("highlight");
                });

                // Delete button event
                row.querySelector(".delete-btn").addEventListener("click", function (e) {
                    e.stopPropagation(); // Prevent row click event
                    row.remove();
                });

                // Focus event for row
                row.addEventListener("focus", function () {
                    row.classList.add("focused");
                });

                // Blur event to remove focus effect
                row.addEventListener("blur", function () {
                    row.classList.remove("focused");
                });

                // Append row to table
                tableBody.appendChild(row);

                // Reset form
                form.reset();
            });
        });
    </script>

    <style>
        body {
            font-family: 'CustomFont', sans-serif;
            font-size: 20px;
            text-align: center;
            text-shadow: 0px 3px 7px rgb(255, 136, 0);
            background: url("mcqueenHD.jpg") no-repeat center center/cover;
            height: 100vh;
            overflow: hidden;
        }

        input,
        textarea,
        button {
            display: block;
            margin: 10px auto;
            padding: 10px;
            font-size: 16px;
            border: 1px solid black;
            border-radius: 5px;
            width: 80%;
            max-width: 400px;
        }

        button {
            background-color: #000000;
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        /* Hover effect */
        button:hover {
            background-color: #7a7979;
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.01);
        }

        .table-title-container {
            margin-top: 60px;
            font-size: 30px;
            font-weight: 1000;
        }

        table {
            top: 50%;
            width: 50%;
            margin:auto;
            border-collapse: collapse;
            background-color: #ffffffd0;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            font-weight: 120;
        }

        th {
            background-color: rgb(255, 255, 255, 0.8);
        }

        tr:hover {
            background-color: lightgray;
            transition: 0.3s ease-in-out;
        }

        .highlight {
            background-color: rgb(255, 136, 0, 0.7);
        }

        .delete-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }

        .delete-btn:hover {
            background-color: darkred;
        }

        .focused {
            border: 2px solid blue;
            box-shadow: 0 0 8px rgba(0, 0, 255, 0.5);
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>

<body>

    <h2>Class Information Form</h2>
    <div class="form-container">
        <form id="class-form">
            <input type="text" id="class-name" placeholder="Class Name" required>
            <input type="number" id="num-people" placeholder="Number of People" required>
            <textarea id="description" placeholder="Description" required></textarea>
            <button type="submit">Add Class</button>
        </form>
    </div>

    <table>
        <div class="table-title-container">Class Table</div>
        <thead>
            <tr>
                <th>Class Name</th>
                <th>Number of People</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Dynamic rows will be added here -->
        </tbody>
    </table>

</body>

</html>
